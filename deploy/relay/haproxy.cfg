# Промежуточный сервер Ginger: пересылает TCP 80/443 в Стамбул как есть, без расшифровки.
# PROXY protocol v2 передаёт основному серверу настоящий IP игрока (лимиты, журналы).
global
    log /dev/log local0 notice
    maxconn 20000
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

listen https
    bind :::443 v4v6
    server origin 38.180.208.25:443 send-proxy-v2 check inter 30s

# Порт 80 — без PROXY protocol: Caddy ждёт его только на 443, а на 80 отвечал 400 каждому, кто
# набрал адрес без https:// (05.10.2026). Здесь только перенаправление на https и проверки ACME —
# настоящий IP игрока на них не нужен.
listen http
    bind :::80 v4v6
    server origin 38.180.208.25:80 check inter 30s
