<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day2 — колонка места, 9-max</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A09;--text:#F5F2EA;--text-on-gold:#1C1503;
  --gold:#D9B36A;--gold-grad:linear-gradient(180deg,#F1D68E 0%,#D3A94F 100%);
  --font:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060505;font-family:var(--font);color:var(--text);display:flex;justify-content:center;padding:16px}
.phone{width:390px;height:844px;background:var(--bg);border:1px solid rgba(255,255,255,.13);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.hd b{font-size:13.5px;font-weight:800}
.tw{flex:1;position:relative;padding:10px 10px 0;min-height:0}
.table{position:relative;width:100%;height:100%;border-radius:28% / 14%;
  background:
    radial-gradient(70% 42% at 50% 40%, rgba(217,179,106,.15) 0%, rgba(217,179,106,.03) 45%, transparent 70%),
    radial-gradient(120% 85% at 50% 45%, #2A2318 0%, #191408 55%, #0E0B06 100%);
  border:2px solid rgba(217,179,106,.4);
  box-shadow:inset 0 0 0 5px rgba(11,10,9,.85),inset 0 0 0 6.5px rgba(217,179,106,.2)}
.logo{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-weight:800;font-size:28px;color:rgba(217,179,106,.12);pointer-events:none}
.board{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;gap:4px}
.card{width:26px;height:36px;border-radius:4px;border:1px solid rgba(217,179,106,.3);background:linear-gradient(140deg,#4A3D24,#241E13);color:rgba(217,179,106,.35);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.card.face{background:#F5F2EA;color:#1C1503;border-color:#ddd}
.pot{position:absolute;left:50%;top:52%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#F1D68E}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:72px;gap:2px}
.holes{display:flex;gap:1px;min-height:22px;align-items:center}
.hole{width:16px;height:22px;border-radius:3px;border:1px solid rgba(217,179,106,.3);background:linear-gradient(140deg,#4A3D24,#241E13)}
.hole.face{background:#F5F2EA;border-color:#ccc;color:#111;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center}
.av{width:36px;height:36px;border-radius:999px;border:1.5px solid rgba(255,255,255,.15);background:rgba(28,26,22,.94);color:#D9B36A;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.seat--hero .av{background:var(--gold-grad);color:var(--text-on-gold);border-color:transparent}
.nm{font-size:11px;font-weight:700;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.stk{font-size:11px;font-weight:800;color:#F1D68E;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:100%;margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;background:rgba(255,107,107,.15);color:#FF6B6B}
.chip{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid rgba(217,179,106,.4);background:rgba(11,10,9,.7);padding:1px 7px;font-size:9.5px;font-weight:800;color:#F1D68E;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold-grad)}
.bar{flex-shrink:0;padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.13);background:#141311}
.go{width:100%;height:48px;border:none;border-radius:12px;background:var(--gold-grad);color:var(--text-on-gold);font:800 15px var(--font)}
</style>
</head>
<body>
<div class="phone">
  <div class="hd"><b>100 / 200 · банк 1 100</b></div>
  <div class="tw">
    <div class="table">
      <div class="logo">Day2</div>
      <div class="board"><span class="card">2</span><span class="card">2</span><span class="card">2</span></div>
      <div class="pot">ПРЕФЛОП</div>

      <div class="seat seat--hero" style="left:50%;top:89.2%">
        <div class="holes"><span class="hole face">A♠</span><span class="hole face">K♠</span></div>
        <span class="av">BTN</span><span class="nm">Вы</span><span class="stk">20 000</span>
      </div>
      <div class="seat" style="left:22.9%;top:80.0%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">SB</span><span class="nm">Андрей</span><span class="stk">18 400</span>
      </div>
      <div class="seat" style="left:8.4%;top:56.8%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">BB</span><span class="nm">Маша</span><span class="stk">19 200</span>
      </div>
      <div class="seat" style="left:13.5%;top:30.4%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">UTG</span><span class="nm">Игрок 4</span><span class="stk">20 000</span>
        <span class="badge">ФОЛД</span>
      </div>
      <div class="seat" style="left:35.6%;top:13.2%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">+1</span><span class="nm">Костя</span><span class="stk">11 600</span>
      </div>
      <div class="seat" style="left:64.4%;top:13.2%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">+2</span><span class="nm">Игрок 6</span><span class="stk">20 000</span>
      </div>
      <div class="seat" style="left:86.5%;top:30.4%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">MP</span><span class="nm">Сергей</span><span class="stk">14 800</span>
      </div>
      <div class="seat" style="left:91.6%;top:56.8%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">HJ</span><span class="nm">Игрок 8</span><span class="stk">20 000</span>
      </div>
      <div class="seat" style="left:77.1%;top:80.0%">
        <div class="holes"><span class="hole"></span><span class="hole"></span></div>
        <span class="av">CO</span><span class="nm">Игрок 9</span><span class="stk">9 200</span>
      </div>

      <span class="chip" style="left:30%;top:68%"><span class="dot"></span>200</span>
      <span class="chip" style="left:18%;top:52%"><span class="dot"></span>400</span>
    </div>
  </div>
  <div class="bar"><button class="go">Начать раздачу · 9 игроков</button></div>
</div>
</body>
</html>
