<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day2 — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==== токены Day2 (из styleguide v2) ==== */
:root{
  --bg:#0B0A09;--surface:#141311;--surface-2:#1C1A16;--surface-3:#26231D;
  --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);--line-gold:rgba(217,179,106,.35);
  --text:#F5F2EA;--text-2:#A9A395;--text-3:#6E6A5F;--text-on-gold:#1C1503;
  --gold:#D9B36A;--gold-soft:rgba(217,179,106,.13);
  --gold-grad:linear-gradient(180deg,#F1D68E 0%,#D3A94F 100%);
  --danger:#FF6B6B;
  --r-sm:10px;--r-md:12px;--r-lg:18px;--r-full:999px;
  --font:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060505;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.5;display:flex;justify-content:center}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen{width:100%;max-width:420px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;padding:0 20px calc(24px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;padding:14px 0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.logo{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:26px;letter-spacing:-.02em;margin:28px 0 6px}
.logo .chip2{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--gold-grad);color:var(--text-on-gold);border-radius:10px;font-size:20px;font-weight:800;transform:rotate(-4deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

.h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:18px}
.sub{font-size:14px;color:var(--text-2);margin-top:6px;max-width:300px}

.form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field__label{font-size:13px;font-weight:600;color:var(--text-2)}
.input{height:52px;padding:0 16px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);color:var(--text);font-family:var(--font);font-size:17px;width:100%;transition:border-color .15s}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--gold)}
.field__hint{font-size:12px;color:var(--text-3)}

.consent{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.consent input{appearance:none;width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);cursor:pointer;flex-shrink:0;margin-top:1px;position:relative}
.consent input:checked{background:var(--gold-grad);border-color:transparent}
.consent input:checked::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--text-on-gold);border-width:0 2px 2px 0;transform:rotate(45deg)}
.consent span{font-size:12px;color:var(--text-3)}
.consent a{color:var(--gold);text-decoration:none;font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:var(--font);font-weight:800;letter-spacing:.01em;border-radius:var(--r-md);height:52px;width:100%;font-size:16px;transition:background .15s,transform .06s}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--gold-grad);color:var(--text-on-gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 18px rgba(211,169,79,.22)}
.btn--primary:disabled{background:var(--surface-2);color:var(--text-3);box-shadow:none;cursor:not-allowed}
.btn--ghost{background:transparent;color:var(--gold);font-weight:700}
.btn--ghost:hover{background:var(--gold-soft)}

/* OTP */
.otp{display:flex;gap:9px;justify-content:space-between}
.otp__cell{flex:1;max-width:54px;height:60px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);color:var(--text);font-size:24px;font-weight:800;text-align:center;font-family:var(--font);font-variant-numeric:tabular-nums}
.otp__cell:focus{outline:none;border-color:var(--gold)}
.resend{font-size:13px;color:var(--text-3);text-align:center}
.resend b{color:var(--text-2);font-variant-numeric:tabular-nums}
.change{border:none;background:none;color:var(--gold);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;padding:4px}

.foot{margin-top:auto;padding-top:32px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="screen">

  <div class="top">
    <button class="icon-btn" aria-label="Назад" onclick="showStep(1)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>

  <div class="logo">Day<span class="chip2">2</span></div>

  <!-- ШАГ 1: email -->
  <div id="step1">
    <h1 class="h1">Вход по email</h1>
    <p class="sub">Закладки, напоминания и ваша статистика будут доступны на всех устройствах.</p>

    <div class="form">
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" placeholder="you@example.com" type="email" inputmode="email" autocomplete="email">
        <span class="field__hint">Письмо придёт в течение минуты. Проверьте папку «Спам»</span>
      </div>

      <label class="consent">
        <input type="checkbox" checked>
        <span>Соглашаюсь с <a href="#">политикой конфиденциальности</a> и даю согласие на обработку персональных данных</span>
      </label>

      <button class="btn btn--primary" onclick="showStep(2)">Получить код</button>
    </div>

    <div class="foot">
      <button class="btn btn--ghost">Продолжить без входа</button>
    </div>
  </div>

  <!-- ШАГ 2: код -->
  <div id="step2" class="hidden">
    <h1 class="h1">Код из письма</h1>
    <p class="sub num">Отправили на <b style="color:var(--text)">i••••@mail.ru</b> <button class="change" onclick="showStep(1)">Изменить</button></p>

    <div class="form">
      <div class="otp">
        <input class="otp__cell" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
        <input class="otp__cell" maxlength="1" inputmode="numeric">
        <input class="otp__cell" maxlength="1" inputmode="numeric">
        <input class="otp__cell" maxlength="1" inputmode="numeric">
        <input class="otp__cell" maxlength="1" inputmode="numeric">
        <input class="otp__cell" maxlength="1" inputmode="numeric">
      </div>

      <p class="resend">Отправить ещё раз можно через <b>0:42</b></p>

      <button class="btn btn--primary" disabled>Войти</button>
    </div>

    <div class="foot">
      <p class="resend">Если письмо не пришло — проверьте папку «Спам»</p>
    </div>
  </div>

</div>

<script>
function showStep(n){
  document.getElementById('step1').classList.toggle('hidden', n!==1);
  document.getElementById('step2').classList.toggle('hidden', n!==2);
}
/* автопереход между OTP-ячейками в макете */
document.querySelectorAll('.otp__cell').forEach((c,i,cells)=>{
  c.addEventListener('input',()=>{ if(c.value && i<cells.length-1) cells[i+1].focus(); });
  c.addEventListener('keydown',e=>{ if(e.key==='Backspace' && !c.value && i>0) cells[i-1].focus(); });
});
</script>
</body>
</html>
