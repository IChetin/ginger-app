<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day2 — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A09;--surface:#141311;--surface-2:#1C1A16;--surface-3:#26231D;
  --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);--line-gold:rgba(217,179,106,.35);
  --text:#F5F2EA;--text-2:#A9A395;--text-3:#6E6A5F;--text-on-gold:#1C1503;
  --gold:#D9B36A;--gold-soft:rgba(217,179,106,.13);
  --gold-grad:linear-gradient(180deg,#F1D68E 0%,#D3A94F 100%);
  --danger:#FF6B6B;--danger-soft:rgba(255,107,107,.13);
  --r-sm:10px;--r-md:12px;--r-lg:18px;--r-full:999px;
  --shadow-2:0 8px 24px rgba(0,0,0,.5);
  --font:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060505;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.5;display:flex;justify-content:center}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.screen{width:100%;max-width:420px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Шапка профиля */
.head{display:flex;align-items:center;gap:14px;padding:24px 16px 20px}
.avatar{width:64px;height:64px;border-radius:20px;background:var(--gold-grad);color:var(--text-on-gold);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;transform:rotate(-3deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);flex-shrink:0}
.head__nick{font-size:21px;font-weight:800;letter-spacing:-.01em}
.head__email{font-size:13px;color:var(--text-3);margin-top:2px}
.head__edit{margin-left:auto;width:38px;height:38px;border-radius:12px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2)}

/* Баннер установки PWA */
.pwa{margin:0 16px 8px;display:flex;gap:12px;align-items:center;padding:14px;background:var(--gold-soft);border:1px solid var(--line-gold);border-radius:var(--r-md)}
.pwa__icon{width:40px;height:40px;border-radius:12px;background:var(--gold-grad);color:var(--text-on-gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;transform:rotate(-4deg);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pwa__t{font-size:14px;font-weight:700}
.pwa__s{font-size:12px;color:var(--text-2)}

/* Группы настроек */
.group{margin:16px 16px 0}
.group__title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;background:none;border:none;width:100%;font-family:var(--font);color:var(--text);text-align:left;font-size:15px}
.row + .row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row__icon{width:34px;height:34px;border-radius:10px;background:var(--surface-3);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row__label{flex:1;font-weight:600}
.row__sub{font-size:12px;color:var(--text-3);font-weight:400;margin-top:1px}
.row__value{font-size:13px;color:var(--text-2);font-weight:600}
.row__chev{color:var(--text-3)}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch__track{position:absolute;inset:0;background:var(--surface-3);border-radius:var(--r-full);transition:background .15s;cursor:pointer}
.switch__track::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .15s}
.switch input:checked + .switch__track{background:var(--gold-grad)}
.switch input:checked + .switch__track::after{transform:translateX(20px)}
.logout{margin:24px 16px 0;display:flex;align-items:center;justify-content:center;height:48px;width:calc(100% - 32px);background:transparent;border:1px solid rgba(255,107,107,.35);border-radius:var(--r-md);color:var(--danger);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer}
.logout:hover{background:var(--danger-soft)}
.ver{text-align:center;font-size:12px;color:var(--text-3);margin-top:16px}

.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:388px;display:flex;background:rgba(20,19,17,.92);backdrop-filter:blur(12px);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow-2);z-index:30}
.bottom-nav__item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:none;background:none;color:var(--text-3);font-family:var(--font);font-size:10px;font-weight:700;border-radius:var(--r-md);cursor:pointer}
.bottom-nav__item--active{color:var(--gold);background:var(--gold-soft)}
</style>
</head>
<body>
<div class="screen">

  <div class="head">
    <div class="avatar">ИВ</div>
    <div><div class="head__nick">ivan_mtt</div><div class="head__email num">i••••@mail.ru</div></div>
    <button class="head__edit" aria-label="Редактировать профиль"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg></button>
  </div>

  <div class="pwa">
    <div class="pwa__icon">2</div>
    <div><div class="pwa__t">Установите Day2 на экран</div><div class="pwa__s">Иначе push-напоминания на iPhone не работают</div></div>
    <svg class="ic" style="margin-left:auto;color:var(--gold)" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div class="group">
    <div class="group__title">Напоминания</div>
    <div class="list">
      <button class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-1.5 3h15L18 13V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
        <span class="row__label">Интервалы по умолчанию<div class="row__sub">Для новых закладок</div></span>
        <span class="row__value">за 24 ч и 2 ч</span>
        <svg class="ic row__chev" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <label class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M4 8l8 6 8-6"/><rect x="4" y="5" width="16" height="14" rx="2"/></svg></span>
        <span class="row__label">Push-уведомления<div class="row__sub">На этом устройстве</div></span>
        <span class="switch"><input type="checkbox" checked><span class="switch__track"></span></span>
      </label>
    </div>
  </div>

  <div class="group">
    <div class="group__title">Аккаунт</div>
    <div class="list">
      <button class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 6v6l4 2"/></svg></span>
        <span class="row__label">Базовая валюта<div class="row__sub">Для итогов трекера</div></span>
        <span class="row__value">₽ RUB</span>
        <svg class="ic row__chev" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M4 8l8 6 8-6"/><rect x="4" y="5" width="16" height="14" rx="2"/></svg></span>
        <span class="row__label">Email<div class="row__sub">Запасной контакт</div></span>
        <span class="row__value" style="color:var(--gold)">Привязать</span>
        <svg class="ic row__chev" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="group">
    <div class="group__title">О приложении</div>
    <div class="list">
      <button class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M21 4 3 11l6 2 2 6 3.5-4.5L19 17z"/></svg></span>
        <span class="row__label">Поддержка в Telegram</span>
        <svg class="ic row__chev" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="row">
        <span class="row__icon"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4-3 7.5-7 9-4-1.5-7-5-7-9V7z"/></svg></span>
        <span class="row__label">Политика конфиденциальности</span>
        <svg class="ic row__chev" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <button class="logout">Выйти</button>
  <div class="ver num">Day2 · версия 0.1.0</div>

  <nav class="bottom-nav">
    <button class="bottom-nav__item"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Серии</button>
    <button class="bottom-nav__item"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13h3M8 17h6"/></svg>Календарь</button>
    <button class="bottom-nav__item"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Закладки</button>
    <button class="bottom-nav__item"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Трекер</button>
    <button class="bottom-nav__item bottom-nav__item--active"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>Профиль</button>
  </nav>

</div>
</body>
</html>
