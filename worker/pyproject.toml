[project]
name = "day2-worker"
version = "0.1.0"
description = "Day2 background worker (APScheduler)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "pywebpush>=2.3.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["worker"]

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*", "pywebpush", "pywebpush.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
