<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A09" />
    <script>
      // Применяем тему до первого рендера, чтобы не было вспышки чужой темы.
      // Источник — cookie-зеркало выбора (в IndexedDB тот же выбор, но он асинхронный).
      (function () {
        var match = document.cookie.match(/(?:^|; )day2_theme=([^;]*)/);
        var choice = match ? decodeURIComponent(match[1]) : "system";
        if (choice !== "light" && choice !== "dark") choice = "system";
        var resolved =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : choice;
        if (choice === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", choice);
        document.documentElement.classList.toggle("dark", resolved === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", resolved === "light" ? "#F4EEE2" : "#0B0A09");
      })();
    </script>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/golos-text-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/tektur-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Ginger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
