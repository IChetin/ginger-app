<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0B0A09" />
    <!-- Расписания и подборки — ручная работа: не для обучения ИИ и выгрузки (правила: /terms). -->
    <meta name="robots" content="noai, noimageai" />
    <script>
      // Применяем тему до первого рендера, чтобы не было вспышки чужой темы.
      // Источник — cookie-зеркало выбора (в IndexedDB тот же выбор, но он асинхронный).
      (function () {
        var match =
          document.cookie.match(/(?:^|; )ginger_theme=([^;]*)/) ||
          document.cookie.match(/(?:^|; )day2_theme=([^;]*)/);
        var choice = match ? decodeURIComponent(match[1]) : "system";
        if (choice !== "light" && choice !== "dark") choice = "system";
        var resolved =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : choice;
        if (choice === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", choice);
        document.documentElement.classList.toggle("dark", resolved === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", resolved === "light" ? "#F4EEE2" : "#0B0A09");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/golos-text-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/tektur-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Ginger</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Если приложение не поднялось за 15 секунд — скрипт не догрузился. В РФ так бывает,
      // когда провайдер замораживает соединение с зарубежным сервером (30.09): вместо белого
      // экрана — объяснение. Сама страница маленькая и проходит, поэтому подсказка здесь.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#0b0a09;color:#f3ead8;font:15px/1.5 system-ui,sans-serif;text-align:center">' +
          '<img src="/favicon.svg" alt="" width="72" height="68" style="margin-bottom:20px">' +
          '<p style="margin:0;font-weight:700;font-size:17px">Ginger не загрузился</p>' +
          '<p style="margin:8px 0 0;max-width:300px;color:#b9ad97;font-size:14px">Проверьте интернет. Если вы в России — включите VPN: некоторые провайдеры ограничивают соединение с приложением.</p>' +
          '<button type="button" onclick="location.reload()" style="margin-top:20px;height:44px;padding:0 28px;border:0;background:#d9b36a;color:#1a1408;font:700 15px system-ui,sans-serif">Повторить</button>' +
          "</div>";
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
