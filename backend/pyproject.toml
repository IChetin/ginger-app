[project]
name = "day2-backend"
version = "0.1.0"
description = "Day2 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "argon2-cffi>=25.1.0",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "qrcode[pil]>=8.2",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: does not require PostgreSQL",
    "integration: requires PostgreSQL",
    "slow: optional long-running (OCR etc.)",
]
